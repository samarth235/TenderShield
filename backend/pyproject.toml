[project]
name = "tendershield-backend"
version = "0.1.0"
description = "TenderShield Nexus - explainable tender assurance & evidence intelligence (backend + AI/ML)"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E741", "B008", "B905"]
